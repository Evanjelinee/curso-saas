{% extends "base.html" %}
{% block title %}Личный кабинет{% endblock %}
{% block content %}
<h1>Личный кабинет</h1>
<p class="muted">Вы вошли как {{ current_user.email }}</p>

<div class="grid">
  <div class="card stat">
    <div class="stat-number">{{ accounts_count }}</div>
    <div>Instagram-аккаунтов</div>
    <a href="{{ url_for('main.accounts') }}">Открыть</a>
  </div>
  <div class="card stat">
    <div class="stat-number">{{ automations_count }}</div>
    <div>Автоматизаций</div>
    <a href="{{ url_for('main.automations') }}">Открыть</a>
  </div>
  <div class="card stat">
    <div class="stat-number">{{ active_count }}</div>
    <div>Включено</div>
    <a href="{{ url_for('main.automation_new') }}">Создать новую</a>
  </div>
</div>
{% endblock %}
